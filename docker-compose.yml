# ─────────────────────────────────────────────────────────────
# tossinvest-api-mcp — Docker Compose
#
# 이 서버는 MCP stdio 서버입니다. 데몬처럼 계속 떠 있는 서비스가 아니라
# MCP 클라이언트가 stdin/stdout 으로 대화하는 프로세스입니다.
#
#   이미지 빌드:      docker compose build
#   대화형 실행:      docker compose run --rm tossinvest-mcp
#   도구 목록 확인:   docker compose run --rm inspector
#
# `docker compose up` 은 stdin 이 MCP 클라이언트에 연결되지 않으므로
# 실사용에는 적합하지 않습니다. MCP 클라이언트에는 아래 형태로 등록하세요.
#
#   command: docker
#   args: ["run","--rm","-i","--env-file","/절대경로/.env","tossinvest-api-mcp:latest"]
# ─────────────────────────────────────────────────────────────

services:
  tossinvest-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: tossinvest-api-mcp:latest
    container_name: tossinvest-api-mcp

    # stdio transport 필수 설정: stdin 을 열어두고 TTY 는 끈다.
    # tty: true 로 두면 JSON-RPC 프레이밍이 깨질 수 있다.
    stdin_open: true
    tty: false

    # 인증 정보와 모든 TOSSINVEST_* 설정은 .env 로만 주입한다.
    # 이미지에 비밀값을 굽지 않으며, .env 가 없어도 서버는 기동된다
    # (실제 API 호출 시점에만 credentials-missing 을 반환).
    #
    # 안전한 기본값은 Dockerfile 의 ENV 와 서버 자체 기본값에 이미 들어 있으므로
    # TOSSINVEST_* 를 environment: 로 중복 정의하지 않는다.
    # (compose 에서는 environment 가 env_file 보다 우선하므로, 중복 정의하면
    #  .env 에 적어둔 값이 조용히 무시되는 함정이 생긴다.)
    #
    # `required: false` 는 Docker Compose v2.24 이상에서 지원된다.
    env_file:
      - path: .env
        required: false

    # graceful shutdown: 이미지의 ENTRYPOINT 가 tini 를 PID 1 로 두고
    # SIGTERM 을 Node 로 전달한다. 서버는 SIGINT/SIGTERM 에서 정상 종료한다.
    stop_signal: SIGTERM
    stop_grace_period: 10s
    restart: "no"

    # ── 보안 하드닝 ──
    # 이 서버는 파일/DB 쓰기가 없고(토큰은 메모리 보관) 아웃바운드 HTTPS 만 사용한다.
    # 따라서 루트 파일시스템을 읽기 전용으로 두고 /tmp 만 tmpfs 로 허용한다.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    # 읽기 전용 루트에서 일부 런타임이 HOME 에 쓰기를 시도할 수 있으므로 tmpfs 로 돌린다.
    environment:
      HOME: /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: node

    # 로컬 PC 실행을 전제로 한 완만한 자원 제한
    mem_limit: 512m
    pids_limit: 256

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # MCP Inspector 로 컨테이너 안의 도구 목록을 확인한다.
  #   docker compose --profile tools run --rm --service-ports inspector
  # 실행 후 안내되는 http://127.0.0.1:6274 를 브라우저에서 연다.
  #
  # inspector 는 npx 로 패키지를 실행 시점에 내려받으므로 네트워크와 쓰기 가능한
  # 홈 디렉터리가 필요하다. 그래서 메인 서비스보다 제약을 완화한다.
  inspector:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: tossinvest-api-mcp:latest
    container_name: tossinvest-api-mcp-inspector
    profiles: ["tools"]
    stdin_open: true
    tty: true
    user: node
    read_only: false
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: .env
        required: false
    environment:
      # Inspector 전용 설정. TOSSINVEST_* 는 .env 에서 그대로 상속된다.
      # 컨테이너 밖에서 접속해야 하므로 0.0.0.0 바인딩이 필요하지만,
      # 포트는 127.0.0.1 로만 게시하므로 외부 네트워크에 노출되지 않는다.
      HOST: "0.0.0.0"
      ALLOWED_ORIGINS: "http://127.0.0.1:6274,http://localhost:6274"
      DANGEROUSLY_OMIT_AUTH: "true"
    entrypoint: ["npx", "--yes", "@modelcontextprotocol/inspector", "node", "dist/index.js"]
    ports:
      - "127.0.0.1:6274:6274"
      - "127.0.0.1:6277:6277"

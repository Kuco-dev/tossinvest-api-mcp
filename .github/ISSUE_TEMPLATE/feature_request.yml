name: 기능 제안
description: 새로운 기능이나 개선을 제안합니다.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        > [!NOTE]
        > 토스증권이 **새 API를 추가한 경우**에는 보통 코드 변경이 필요 없습니다.
        > `pnpm openapi:update` 로 snapshot을 갱신하면 도구가 자동 생성됩니다.
        > 새 **주문(mutation)** API만 분류 등록이 필요합니다. [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) 참고.

  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 해결하나요?
      description: 제안하는 해결책이 아니라, 겪고 있는 불편을 먼저 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방식
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: 안전정책 확인
      description: 이 프로젝트는 실제 자산에 영향을 주는 API를 다룹니다.
      options:
        - label: 이 제안은 주문 안전장치(dry-run 기본값, 실주문 기본 비활성화, mutation 자동 재시도 금지)를 약화시키지 않습니다.
          required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안
